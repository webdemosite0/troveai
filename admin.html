<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101d">
<title>Trove Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06101d;--panel:#0c1928;--panel2:#101f31;--text:#f7fbff;--muted:#9fb0c3;--dim:#68798d;--line:rgba(191,215,240,.13);--blue:#4f8cff;--cyan:#43d9d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -15%,rgba(79,140,255,.12),transparent 70%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{width:min(1280px,calc(100% - 36px));margin:auto}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand img{width:34px;height:34px;border-radius:10px}.top-right{display:flex;align-items:center;gap:12px}.email{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.btn:hover{background:rgba(255,255,255,.08)}.main{padding:42px 0}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.heading h1{font-size:42px;letter-spacing:-.06em;margin:0 0 7px}.heading p{margin:0;color:var(--muted)}.filters{display:flex;gap:8px}.filters button.active{background:#f5f9ff;color:#07111f;border-color:#f5f9ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}.stat b{display:block;font-size:27px;letter-spacing:-.04em}.stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:16px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;background:rgba(255,255,255,.025)}tr:last-child td{border-bottom:0}.name{font-weight:700}.sub{display:block;color:var(--muted);font-size:12px;margin-top:4px}.message{max-width:390px;color:#c8d3e0;white-space:pre-wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.18);color:#b9d0ff}.status{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:8px;padding:7px}.empty{padding:70px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#0e1b2b,#091522);box-shadow:0 30px 100px rgba(0,0,0,.4)}.login-card h1{margin:0 0 8px;font-size:32px;letter-spacing:-.05em}.login-card p{color:var(--muted);margin:0 0 24px}.field{margin-bottom:13px}.field label{display:block;color:#cbd7e5;font-size:12px;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:#fff;outline:0}.field input:focus{border-color:rgba(79,140,255,.6);box-shadow:0 0 0 3px rgba(79,140,255,.1)}.primary{width:100%;padding:13px;background:#f5f9ff;color:#07111f;border:0;border-radius:10px;font-weight:800;cursor:pointer}.error{color:#ffadad;font-size:12px;margin-top:12px}.loading{text-align:center;color:var(--muted);padding:50px}@media(max-width:700px){.shell{width:min(100% - 24px,1280px)}.top-right .email{display:none}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:34px}.filters{width:100%;overflow:auto}.stats{grid-template-columns:1fr}.main{padding-top:28px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="brand"><img src="assets/trove-logo.svg" alt="Trove"><span>Trove Admin</span></div>
    <h1 style="margin-top:28px">Welcome back.</h1>
    <p>Sign in with the Supabase admin account to view applications.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">Sign in</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="appView" hidden>
  <header class="top"><div class="shell top"><div class="brand"><img src="assets/trove-logo.svg" alt="Trove"><span>Trove Admin</span></div><div class="top-right"><span id="adminEmail" class="email"></span><button id="logout" class="btn">Sign out</button></div></div></header>
  <main class="shell main">
    <div class="heading"><div><h1>Applications</h1><p>Manage talent and investor inquiries from one place.</p></div><div class="filters"><button class="btn active" data-filter="all">All</button><button class="btn" data-filter="join">Talent</button><button class="btn" data-filter="invest">Investors</button></div></div>
    <div class="stats"><div class="stat"><span>Total</span><b id="total">—</b></div><div class="stat"><span>Talent</span><b id="talent">—</b></div><div class="stat"><span>Investors</span><b id="investors">—</b></div></div>
    <div class="table-wrap"><div id="loading" class="loading">Loading applications…</div><table id="table" hidden><thead><tr><th>Applicant</th><th>Type</th><th>Details</th><th>Message</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No applications yet.</div></div>
  </main>
</div>

<script>
const SUPABASE_URL='https://wjgkldnffszedndedjojs.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqZ2tsZG5mZnN6ZWRuZGVqb2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjE2MTIsImV4cCI6MjEwNDUzNzYxMn0.cNwYB7IjDdgK8lo8KCV74qgj7IHy6VjXBnJpfJMJHLs';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let applications=[];let filter='all';
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){
  $('loading').hidden=false;$('table').hidden=true;$('empty').hidden=true;
  const {data,error}=await db.from('applications').select('*').order('created_at',{ascending:false});
  if(error){$('loading').textContent='Could not load applications: '+error.message;return;}
  applications=data||[];$('total').textContent=applications.length;$('talent').textContent=applications.filter(x=>x.type==='join').length;$('investors').textContent=applications.filter(x=>x.type==='invest').length;render();
}
function render(){
  const list=filter==='all'?applications:applications.filter(x=>x.type===filter);
  $('loading').hidden=true;$('empty').hidden=list.length>0;$('table').hidden=list.length===0;
  $('rows').innerHTML=list.map(x=>`<tr><td><div class="name">${escapeHtml(x.name)}</div><span class="sub">${escapeHtml(x.email)}</span>${x.company?`<span class="sub">${escapeHtml(x.company)}</span>`:''}</td><td><span class="badge">${x.type==='join'?'TALENT':'INVESTOR'}</span></td><td>${x.role?`<span class="sub"><b>Role:</b> ${escapeHtml(x.role)}</span>`:''}${x.interest?`<span class="sub"><b>Interest:</b> ${escapeHtml(x.interest)}</span>`:''}${x.link?`<span class="sub"><a href="${escapeHtml(x.link)}" target="_blank" rel="noopener" style="color:#8fb5ff">Profile ↗</a></span>`:''}</td><td><div class="message">${escapeHtml(x.message)}</div></td><td><select class="status" data-id="${x.id}"><option value="new" ${x.status==='new'?'selected':''}>New</option><option value="reviewing" ${x.status==='reviewing'?'selected':''}>Reviewing</option><option value="contacted" ${x.status==='contacted'?'selected':''}>Contacted</option><option value="archived" ${x.status==='archived'?'selected':''}>Archived</option></select></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('');
  document.querySelectorAll('.status').forEach(el=>el.addEventListener('change',async e=>{const id=e.target.dataset.id;const {error}=await db.from('applications').update({status:e.target.value}).eq('id',id);if(error){alert('Could not update status: '+error.message);load();}}));
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(error){$('loginError').textContent=error.message;return;}showApp();});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();showLogin();});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();}));
function showApp(){ $('loginView').hidden=true;$('appView').hidden=false;db.auth.getUser().then(({data})=>{$('adminEmail').textContent=data.user?.email||''});load(); }
function showLogin(){ $('appView').hidden=true;$('loginView').hidden=false; }
db.auth.getSession().then(({data})=>data.session?showApp():showLogin());
</script>
</body>
</html>
